[all]
description = "Run all checks: lint, test, attributions, audit"
depends = ["lint"]
run = """
mise run lint
mise run test
mise run audit
mise run attributions

"""

[format]
description = "Fix formatting and code autofixes ruff can apply"
run = """
uv run --all-extras ruff format .
uv run ruff check --fix .
"""

[lint]
description = "Run linting and formatting checks"
run = """
uv run ruff check .
uv run ruff format --check .
uv run pyrefly check
uv run deptry src
"""

[install]
description = "Install dev dependencies and pre-commit hooks"
run = """
if [ -f uv.lock ]; then
  uv sync --all-extras --locked
elif [ -n "${CI:-}" ]; then
  echo "uv.lock missing: run uv lock and commit it" >&2
  exit 1
else
  uv sync --all-extras
fi
if [ -e .git ]; then
  uv run pre-commit install
fi
"""

[clean]
description = "Clean build artifacts and caches"
run = """
rm -rf .pytest_cache .ruff_cache .venv .coverage
rm -rf dist && mkdir -p dist && touch dist/.keep
rm -rf reports && mkdir -p reports && touch reports/.keep
"""

[act]
description = "Run GitHub Actions locally via act"
run = """
act -j test --env-file .act-env-public --secret-file .act-env-secret \
  --container-architecture linux/amd64 \
  -P ubuntu-latest=catthehacker/ubuntu:act-latest \
  --action-offline-mode --container-daemon-socket -
"""

[setup]
description = "Setup dev environment post project creation"
run = """
mise run install
uv run ruff format .
if [ -e .git ]; then
  touch .act-env-secret
  uv run pre-commit install
  uv run detect-secrets scan --exclude-lines '^\\s*rev: "?[0-9a-f]{40}"?(\\s|$)' > .secrets.baseline
  git add .
  uv run pre-commit || true
  git add .
fi
"""

[update_from_template]
description = "Update from copier template"
run = """
copier update --trust --skip-answered --skip-tasks
mise run lint
mise run audit
"""

[test]
description = "Run tests (default: unit+integration+e2e)"
run = """
mise run test:unit
mise run test:integration
mise run test:e2e
mise run test:coverage
"""

["test:unit"]
description = "Run unit tests"
run = "uv run pytest --disable-warnings --junitxml=reports/junit_unit.xml -m unit --cov-append"

["test:integration"]
description = "Run integration tests"
run = """
uv run pytest --disable-warnings --junitxml=reports/junit_integration_parallel.xml -n auto --dist worksteal -m "integration and not sequential" --cov-append || [ $? -eq 5 ]
uv run pytest --disable-warnings --junitxml=reports/junit_integration_sequential.xml -m "integration and sequential" --cov-append || [ $? -eq 5 ]
"""

["test:e2e"]
description = "Run e2e tests"
run = """
uv run pytest --disable-warnings --junitxml=reports/junit_e2e_parallel.xml -n auto --dist worksteal -m "e2e and not sequential" --cov-append || [ $? -eq 5 ]
uv run pytest --disable-warnings --junitxml=reports/junit_e2e_sequential.xml -m "e2e and sequential" --cov-append || [ $? -eq 5 ]
"""

["test:scheduled"]
description = "Run scheduled tests"
run = "uv run pytest --disable-warnings --junitxml=reports/junit_scheduled.xml -m scheduled --cov-append"

["test:sequential"]
description = "Run sequential tests"
run = "uv run pytest --disable-warnings --junitxml=reports/junit_sequential.xml -m sequential --cov-append"

["test:lowest_direct"]
description = "Fail on HIGH/CRITICAL vulnerabilities in the lowest-direct SBOM, then run unit tests at the floors"
run = """
mkdir -p reports
# --no-build: resolve from index metadata only, so no package code runs before the scan
uv export --preview-features sbom-export --format cyclonedx1.5 --resolution lowest-direct --all-extras --no-build --output-file reports/sbom-lowest-direct-all.json --quiet
trivy sbom reports/sbom-lowest-direct-all.json --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --ignorefile .trivyignore
export UV_PYTHON=$(mise run python_min_version)
uv sync --resolution lowest-direct
# --frozen: plain uv run re-locks at highest and re-syncs, so the floors never run (#520)
uv run --frozen pytest -m unit --no-cov
"""

["test:coverage"]
description = "Fail if combined coverage of the test runs so far is below the floor"
run = "uv run coverage report --skip-covered --skip-empty --fail-under=85"

["test:python_versions"]
description = "Run unit tests on the oldest and newest supported Python (tox envs in pyproject.toml)"
run = "uv run tox --parallel"

["test:coverage_reset"]
description = "Reset test coverage data"
run = "rm -rf .coverage reports/coverage*"


["test:all"]
description = "Reset run all the test types"
run = """
mise run test:unit
mise run test:integration
mise run test:e2e
mise run test:scheduled
mise run test:sequential
mise run test:lowest_direct
"""

[audit]
description = "Run security and license compliance audit"
usage = '''
flag "--baseline <path>" help="Baseline prod audit JSON for PR diff mode (only new findings fail)"
flag "--baseline-all <path>" help="Baseline all-packages audit JSON for PR diff mode (only new dev vuln findings fail)"
flag "--severity <levels>" help="Comma-separated vulnerability severities that fail the audit (default: HIGH,CRITICAL)"
'''
run = "bash .mise/scripts/run_audit.sh ${usage_baseline:+--baseline \"$usage_baseline\"} ${usage_baseline_all:+--baseline-all \"$usage_baseline_all\"} ${usage_severity:+--severity \"$usage_severity\"}"

[attributions]
description = "Generate reports/ATTRIBUTIONS.md from installed package licenses"
run = "uv run python .mise/scripts/generate_attributions.py"

[bump]
description = "Trigger the Release Bump workflow on GitHub Actions"
usage = 'arg "[cz_args]..." help="Arguments to pass to cz bump (e.g. --increment major --prerelease rc)"'
run = """
gh workflow run bump.yml -f arguments="${usage_cz_args:-}"
"""

[pre_commit_run_all]
description = "Run pre-commit hooks on all files"
run = "uv run pre-commit run --all-files"

[pre_push_run_all]
description = "Run pre-push hooks on all files (unit tests)"
run = "uv run pre-commit run --all-files --hook-stage pre-push"

[merge_bots]
description = "Merge all origin/renovate/* and origin/dependabot/* branches into the current branch, preferring their side on conflicts"
alias = "merge_bots"
run = """
set -e
git fetch --prune origin
for branch in $(git for-each-ref --format='%(refname:short)' 'refs/remotes/origin/renovate/*' 'refs/remotes/origin/dependabot/*'); do
  echo "==> merging $branch"
  git merge --no-edit -X theirs "$branch" --no-verify || {
    echo "unresolvable conflict in $branch - resolve it, then 'git commit' and re-run this task"
    exit 1
  }
done
echo "done - now regenerate lockfiles: uv lock && mise install"
"""