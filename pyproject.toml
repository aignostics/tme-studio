[project]
name = "aignostics-tme-studio"
version = "0.4.0"
description = "🎨 A toolkit to explore the Aignostics OpenTME dataset."
readme = "README.md"
authors = [
    { name = "Maaike Galama", email = "support@aignostics.com" },
    { name = "Christina Embacher", email = "support@aignostics.com" },
]
maintainers = [
    { name = "Ari Angelo", email = "support@aignostics.com" },
    { name = "Cornelius Böhm", email = "support@aignostics.com" },
]
license = { file = "LICENSE" }

keywords = [
    "aignostics-tme-studio",
    "act",
    "copier",
    "detect-secrets",
    "jupyter",
    "foundry",
    "foundry-python",
    "pre-commit",
    "pytest",
    "python",
    "pypi",
    "ruff",
    "sonarqube",
    "sonarcloud",
    "uv",
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Framework :: Pytest",
    "Typing :: Typed",
    "Natural Language :: English",
]

requires-python = ">=3.11, <3.15"

dependencies = [
    "attrs>=25.3.0",
    "huggingface-hub>=1.7.2",
    "lifelines>=0.30.0",
    "marimo>=0.20.4",
    "munch>=4.0.0",
    "numpy>=2.2.0",
    "pandas>=3.0.1",
    "plotly>=6.6.0",
    "pyyaml>=6.0.2",
    "requests>=2.33.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.15.0",
    "tabulate>=0.10.0",
]

[dependency-groups]
dev = [
    "commitizen>=4.1.0,<5",
    "deptry>=0.25.0,<1",
    "detect-secrets>=1.5.0",
    "enum-tools>=0.13.0",
    "pre-commit>=4.5.0,<5",
    "pyrefly>=1.0.0,<2",
    "pytest>=9.0.2,<10",
    "pytest-asyncio>=1.3.0,<2",
    "pytest-cov>=7.0.0,<8",
    "pytest-docker>=3.2.5,<4",
    "pytest-env>=1.1.5,<2",
    "pytest-md-report>=0.7.0,<1",
    "pytest-randomly>=4.1.0,<5",
    "pytest-regressions>=2.7.0,<3",
    "pytest-retry>=1.7.0,<2",
    "pytest-subprocess>=1.5.3,<2",
    "pytest-timeout>=2.3.1,<3",
    "pytest-watcher>=0.4.3,<1",
    "pytest-xdist[psutil]>=3.6.1,<4",
    "ruff>=0.15.15,<1",
    "tox>=4.58.0",
    "tox-uv>=1.36.0",
    "types-pyyaml>=6.0.12.20250402",
    "types-requests>=2.32.0.20250328",
    "watchdog>=6.0.0",
]


[tool.uv]
required-version = ">=0.11.14"
keyring-provider = "subprocess"
override-dependencies = [ # https://github.com/astral-sh/uv/issues/4422
    "nbconvert>=7.17.1",    # fix for CVE-2025-53000
    "pytest>=9.0.2",        # pytest-md-report depends on pytest<9 unnecessarily
    "pymdown-extensions>=10.21.2",      # 10.21 breaks fenced code blocks with markdown>=3.10 (AttributeError in superfences)
    "pytest>=9.0.3",                    # CVE-2025-71176; pytest-md-report also depends on pytest<9 unnecessarily
    "pyasn1>=0.6.3",        # CVE-2026-30922
    "requests>=2.33.0,<3",  # CVE-2026-25645
    "lxml>=6.1.0",          # CVE-2026-41066
    "tifffile<2026.5.15",   # cooldown: 2026.5.15 too young (<10d), pin to older release
    "pip>=26.1.2",          # PYSEC-2026-196
    "aiohttp>=3.14.1",      # CVE-2026-54273, CVE-2026-54279, CVE-2026-54277, CVE-2026-54276, CVE-2026-54278, CVE-2026-54280, CVE-2026-54274, CVE-2026-54275
    "cryptography>=48.0.1", # GHSA-537c-gmf6-5ccf
]

# Pin the index URL spelling so uv.lock does not churn between uv releases
# (uv >=0.12 normalizes the implicit default index to a trailing slash).
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"


[project.urls]
Homepage = "https://github.com/aignostics/tme-studio"
Documentation = "https://github.com/aignostics/tme-studio#readme"
Source = "https://github.com/aignostics/tme-studio"
Changelog = "https://github.com/aignostics/tme-studio/releases"
Issues = "https://github.com/aignostics/tme-studio/issues"


[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]

module-name = "aignostics_tme_studio"



[tool.ruff]
target-version = "py311"
preview = true
fix = true
line-length = 120

[tool.ruff.lint]
select = ["ALL"]

ignore = [
    "missing-type-args",   # missing type annotation for `*args` -> provides no value
    "missing-type-kwargs",   # missing type annotation for `**kwargs`` -> provides no value
    "async-function-with-timeout", # async function definition with a `timeout` parameter  -> as mentioned by ruff, "This rule is highly opinionated and may not be suitable for all use cases."
    "missing-copyright-notice",   # missing copyright notice -> not for OSS
    "docstring-extraneous-exception",   # docstrings with exceptions not raised in the code of the function -> not always necessary
    "incorrect-blank-line-before-class",     # incomptatible with D211 -> prefer D211
    "multi-line-summary-first-line",     # incompatible with D213 -> prefer D213
    "boolean-type-hint-positional-argument",   # boolean positional arguments -> disagree
    "boolean-default-value-positional-argument",   # boolean defautl value positionl arguments -> disagree
    "boolean-positional-value-in-call",   # boolean positional value in function call -> disagree
    "blanket-type-ignore",   # use specific rule codes when ignoring type issues -> quite a hassle, no value
    "try-consider-else",   # else instead of return before except. -> strongly disagree, hinders readabilty.
    "missing-trailing-comma",   # conflicts with ruff formatter -> not feasible nor recommended
    "single-line-implicit-string-concatenation",   # conflicts with ruff formatter -> not feasible nor recommended
    "suspicious-subprocess-import",     # subprocess` module is possibly insecure -> as mentioned by ruff, unstable and preview
    "line-contains-todo",   # line contains todo -> yes, that's what todo's are for?!
    "missing-todo-link",    # missing issue link for todo -> not in OSS
    "builtin-open",   # use of open to be replaced with Path.open
    "print",     # Remove `print`
    "implicit-namespace-package",   # Checks for packages that are missing an __init__.py file.
    "non-empty-init-module",   # __init__ module contains conditional imports -> needed for optional dependencies (preview rule)
    "too-many-statements-in-try-clause",  # try clause too many statements -> conflicts with async DB patterns (preview rule)
    "fallible-context-manager",   # context manager does not catch exceptions -> false positives on contextlib.suppress (preview rule)
]

[tool.ruff.lint.per-file-ignores]
# marimo notebooks and cell snippets: every cell is a `def _(mo, df)` with imports
# and bare expressions inside it, which is the marimo authoring model, not a defect
"**/notebooks/**/*.py" = [
    "missing-type-function-argument",   # cell arguments are wired up by marimo, not annotated
    "missing-return-type-private-function",   # cells are generated `def _()` functions
    "import-outside-top-level",   # imports live in the importing cell
    "useless-expression",   # a trailing expression is how a cell renders its output
    "undocumented-public-module",   # notebooks document themselves in markdown cells
    "docstring-missing-returns",
    "too-many-arguments",   # a cell takes one argument per upstream cell it consumes
    "too-many-positional-arguments",
    "magic-value-comparison",
    "used-dummy-variable",   # a leading underscore is how marimo scopes a variable to its cell
]
"**/snippets/**/*.py" = [
    # same marimo cell structure, reused across notebooks
    "missing-type-function-argument",
    "missing-return-type-private-function",
    "import-outside-top-level",
    "undocumented-public-module",
    "used-dummy-variable",   # a leading underscore is how marimo scopes a variable to its cell
]
"**/tests/**/*.py" = [
    # we are more relaxed in tests, while sill applying hundreds of rules
    "assert",     # asserts allowed in tests...
    "ARG",      # unused function args -> fixtures nevertheless are functionally relevant...
    "FBT",      # don't care about booleans as positional arguments in tests, e.g. via @pytest.mark.parametrize()
    "magic-value-comparison",  # magic value used in comparison, ...
    "no-self-use",  # method could be a function, class method, or static method -> test organization pattern
    "pytest-raises-too-broad",    # exception to broad
    "import-private-name",  # private import, but required for unit testing
    "import-outside-top-level",  # local import
    "pytest-raises-with-multiple-statements",    # exception to broad
    "suspicious-non-cryptographic-random-usage",     # standard pseudo-random generators are not suitable for cryptographic purposes
    "private-member-access",   # private member access required for unit testing
    "subprocess-without-shell-equals-true",     # check for execution of untrusted input
    "missing-type-function-argument",   # missing type annotation for function argument
    "missing-type-args",   # missing type annotation
    "missing-type-kwargs",   # missing type annotation
    "missing-return-type-private-function",   # missing return type annotation
    "docstring-missing-returns",   # `return` is not documented in docstring
    "blocking-open-call-in-async-function", # async functions should not open files with blocking methods like `open`
    "hardcoded-bind-all-interfaces",     # bind to all ports
    "start-process-with-partial-path",     # subprocess with partial path
    "pytest-fixture-autouse",   # autouse=True is intentional for setup/teardown fixtures
    "undocumented-public-module",   # test modules are named after their subject
]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyrefly]
preset = "default"
project_excludes = [
    ".venv",
    "dist",
    "build",
    "migrations",
]
search_path = [".", ".mise/scripts"]  # "." makes tests/ importable as absolute package in src-layout projects

[tool.tox]
# Boundary check only: oldest and newest interpreter allowed by requires-python.
# The versions in between are covered by whatever `.python-version` CI runs.
env_list = ["py311", "py314"]
requires = ["tox-uv>=1.36"]

[tool.tox.env_run_base]
description = "Run unit tests on {env_name}"
runner = "uv-venv-lock-runner"
with_dev = true
# --no-cov: these runs must not append to the coverage report the primary run produces.
commands = [["pytest", "--disable-warnings", "--no-cov", "-m", "unit"]]

[tool.pytest.ini_options]
addopts = [
    "-v",
    "--strict-markers",
    "--cov=aignostics_tme_studio",
    "--cov-report=term-missing",
    "--cov-report=xml:reports/coverage.xml",
    "--cov-report=html:reports/coverage_html",
]
testpaths = ["tests"]
python_files = ["*_test.py", "test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 10 # We use a rather short default timeout. Override with @pytest.mark.timeout(timeout=N)
env = ["COVERAGE_FILE=.coverage", "COVERAGE_PROCESS_START=pyproject.toml"]
markers = [
    # Test Categories (following Martin Fowler's Solitary vs Sociable unit test distinction)
    "scheduled: Tests to run on a schedule. They will still be part on non-scheduled test executions.",
    "sequential: Exclude from parallel test execution.",
    "unit: Solitary unit tests - test a layer of a module in isolation with all dependencies mocked. Unit tests must be able to pass offline, i.e. not calls to external services. The timeout should not be bigger than the default 10s, and must be <5 min.",
    "integration: Sociable integration tests - test interactions across architectural layers, using real file I/O and real subprocesses. Integration test must be able to pass offline, i.e. mock external services. The timeout should not be bigger than the default 10s, and must be <5 min.",
    "e2e: End-to-end tests - test complete workflows with real external network services.",
]
md_report = true
md_report_output = "reports/pytest.md"
md_report_verbose = 1
md_report_flavor = "github"
md_report_color = "never"
md_report_exclude_outcomes = ["passed", "skipped"]

[tool.coverage.run]
sigterm = true
relative_files = true
source = ["src"]
omit = []
branch = true
parallel = true
concurrency = ["thread", "multiprocessing"]

[tool.coverage.paths]
source = ["src/"]


[tool.commitizen]
name = "cz_conventional_commits"
use_shortcuts = true
version_provider = "scm"
change_type_map = { "feat" = "Feat", "fix" = "Fix", "refactor" = "Refactor", "perf" = "Perf", "chore" = "Chores", "docs" = "Documentation" }
version_files = [
    "pyproject.toml:version",
    "VERSION",
    "sonar-project.properties:sonar.projectVersion",
]
update_changelog_on_bump = true
major_version_zero = true # Allows breaking changes in 0.x.x versions; remove this line using a breaking-change commit to bump to 1.0.0
version_scheme = "semver2"
tag_format = "v$version"
tag = true
bump_message = "bump: version $current_version → $new_version [skip-ci]"
breaking_change_exclamation_in_title = true

# Pre-release configuration
prerelease = "alpha"  # Default prerelease type
prerelease_offset = 0

changelog_merge_prerelease = true
style = [
    [
        "qmark",
        "fg:#ff9d00 bold",
    ],
    [
        "question",
        "bold",
    ],
    [
        "answer",
        "fg:#ff9d00 bold",
    ],
    [
        "pointer",
        "fg:#ff9d00 bold",
    ],
    [
        "highlighted",
        "fg:#ff9d00 bold",
    ],
    [
        "selected",
        "fg:#cc5454",
    ],
    [
        "separator",
        "fg:#cc5454",
    ],
    [
        "instruction",
        "",
    ],
    [
        "text",
        "",
    ],
    [
        "disabled",
        "fg:#858585 italic",
    ],
]

# Changelog template configuration
template = ".cz-templates/CHANGELOG.md.j2"

[tool.audit]
# SPDX identifiers for production dependencies.
# Dev-only dependencies are not license-scanned — copyleft obligations require distribution,
# which never occurs for internal tooling.
#
# Compound SPDX expressions (e.g. "Apache-2.0 AND MIT") are parsed automatically;
# only individual identifiers are needed here.
#
# file:// entries mean trivy found a license file it could not classify.
# Investigate manually and add to ignored_packages with a comment if verified safe.
allowed_licenses = [
    # Permissive
    "Apache-2.0",
    "0BSD",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "DFSG approved",
    "ISC",
    "MIT",
    "MIT-0",
    "MIT-CMU",
    "PSF-2.0",
    "Public Domain",
    "Python Software Foundation License",
    "Unlicense",
    "Zlib",
    "ZPL-2.1",
    # Weak Copyleft (dynamically linked, unmodified — per Aignostics IS-PL-15)
    "LGPL-2.0-only",
    "LGPL-2.0-or-later",
    "LGPL-2.1-only",
    "LGPL-2.1-or-later",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
    "MPL-2.0",
    # Compound SPDX expressions trivy may report verbatim
    "Apache-2.0 OR BSD-2-Clause",
    "Apache-2.0 OR BSD-3-Clause",
    "MIT AND PSF-2.0",
    "MPL-2.0 AND (Apache-2.0 OR MIT)",
]

# Per-package exceptions. Format: "package" (all versions) or "package@x.y.z" (pinned).
# Pinned versions should be re-checked on upgrade.
ignored_packages = [
    "docutils",  # GPL-3.0 flag is a false positive: only tools/editors/emacs/rst.el is GPL; Python lib is public domain + BSD-2-Clause
]
# Add aignostics-tme-studio-specific license identifiers here if needed.

[tool.deptry.per_rule_ignores]
# Used at runtime without being imported by us.
DEP002 = [
    "tabulate", # backend for pandas `DataFrame.to_markdown()`, never imported directly
]

