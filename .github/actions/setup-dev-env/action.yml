name: 'Setup Dev Environment'
description: 'mise, uv, and dev tools'

# No GCP/WIF auth: every dependency resolves from public PyPI (no extra index in
# pyproject.toml, no pkg.dev entries in uv.lock), so lint, audit and test need no
# cloud credentials. Reinstate google-github-actions/auth here if a private
# Artifact Registry index is ever added.

runs:
  using: 'composite'
  steps:
    - name: Install mise
      uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      with:
        # Keep this pin aligned with contributors' local mise — skew regenerates
        # mise.lock (see docs/foundry/troubleshooting.md, "mise.lock Keeps Changing").
        # Renovate bumps it automatically via the annotation below.
        # renovate: datasource=github-releases depName=jdx/mise
        version: "2026.10.17"

    # mise-action caches ~/.local/share/mise, which holds the pipx:keyring venv but not the
    # interpreter its shebang resolves to. On a cache hit the restored venv can't exec ("keyring
    # couldn't exec process: No such file or directory"), and because mise's shim dir precedes
    # ~/.local/bin on PATH it shadows the working keyring `mise run install` provides — so uv's
    # subprocess keyring-provider silently loses the private-registry token and later steps 401.
    # Probe the shim and rebuild it only when it's broken: a no-op on a cache miss / healthy run,
    # so caching is preserved.
    - name: Repair pipx:keyring shim if a restored mise cache broke it
      shell: bash
      run: keyring --version >/dev/null 2>&1 || mise install pipx:keyring --force

    - name: Initialize mise and install Python dependencies
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: mise run install
