name: 'Setup Dev Environment'
description: 'mise, uv, and dev tools'

# No GCP/WIF auth: every dependency resolves from public PyPI (no extra index in
# pyproject.toml, no pkg.dev entries in uv.lock), so lint, audit and test need no
# cloud credentials. Reinstate google-github-actions/auth here if a private
# Artifact Registry index is ever added.

runs:
  using: 'composite'
  steps:
    - name: Install mise
      uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

    - name: Initialize mise and install Python dependencies
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: mise run install
