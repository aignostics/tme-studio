name: "Publish Package"

on:
  workflow_call:


jobs:
  package_publish:
    runs-on: ubuntu-latest
    # `pypi` environment gates this job: it pauses on the v* tag until a required
    # reviewer (a tme-studio admin, configured in repo Settings > Environments)
    # approves. The OIDC id-token is only minted after approval, so a release
    # triggered by anyone else cannot reach PyPI without an admin.
    environment:
      name: pypi
      url: https://pypi.org/project/aignostics-tme-studio/
    permissions:
      contents: write
      packages: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Dev Environment
        uses: $/.github/actions/setup-dev-env


      - name: Build distribution
        run: uv build

      - name: Have audit checks publish to reports/ for auditing
        run: mise run audit

      - name: Export lowest-direct and highest SBOMs
        # After the audit: --resolution rewrites uv.lock, and sbom.json must come from the committed lock
        # --no-default-groups, not --no-dev: --no-dev keeps default groups other than dev in the SBOM
        run: |
          uv export --preview-features sbom-export --format cyclonedx1.5 --no-default-groups --all-extras --no-build --quiet \
            --resolution lowest-direct --output-file reports/sbom-lowest-direct.json
          uv export --preview-features sbom-export --format cyclonedx1.5 --no-default-groups --all-extras --no-build --quiet \
            --resolution highest --upgrade --output-file reports/sbom-highest.json

      - name: Generate release notes
        shell: bash
        run: |
          if [ -f "CHANGELOG.md" ]; then
            awk '/^## / {if (++count == 2) exit} count == 1' CHANGELOG.md >> RELEASE_NOTES.md
          fi
          if [ ! -s "RELEASE_NOTES.md" ]; then
            echo "No release notes available." >> RELEASE_NOTES.md
          fi
          echo "" >> RELEASE_NOTES.md

      # --keyring-provider disabled overrides pyproject's `keyring-provider = "subprocess"`;
      # uv refuses trusted publishing while any keyring provider is active.
      - name: Publish distribution to PyPI
        run: uv publish --trusted-publishing always --keyring-provider disabled

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} ./dist/* ./reports/* \
            --notes-file RELEASE_NOTES.md \
            --title "${{ github.ref_name }}"
