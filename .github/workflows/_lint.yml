name: "Lint"

on:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Dev Environment
        uses: ./.github/actions/setup-dev-env

      - name: Lint
        # Skip mise-lock: the hook mutates mise.lock (cannot commit in CI, causes "files modified" failure).
        # Lock freshness is not verified in CI on purpose: `mise lock` output format varies by mise
        # version, so a pinned CI mise would fail every contributor whose local mise differs.
        # The pre-commit mise-lock hook keeps it current locally.
        run: SKIP=mise-lock mise run pre_commit_run_all
