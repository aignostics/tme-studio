name: "> Test"

on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: true
      AIGNOSTICS_TME_STUDIO_LOGFIRE_TOKEN:
        required: false
      AIGNOSTICS_TME_STUDIO_SENTRY_DSN:
        required: false

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      checks: write
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Dev Environment
        uses: ./.github/actions/setup-dev-env

      - name: Release version check
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          TOML_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$TAG_VERSION" != "$TOML_VERSION" ]; then
            echo "Release version mismatch: Tag $TAG_VERSION != pyproject.toml $TOML_VERSION"
            exit 1
          fi

      - name: Print development version info
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          TOML_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "Development build - Current version in pyproject.toml: $TOML_VERSION"

      - name: Create .env file
        uses: SpicyPizza/create-envfile@ace6d4f5d7802b600276c23ca417e669f1a06f6f # v2.0.3
        with:
          envkey_TME_STUDIO_LOGFIRE_TOKEN: "${{ secrets.TME_STUDIO_LOGFIRE_TOKEN }}"
          envkey_TME_STUDIO_SENTRY_DSN: "${{ secrets.TME_STUDIO_SENTRY_DSN }}"
          fail_on_empty: false

      - name: Test / Unit
        uses: ./.github/actions/run-tests
        with:
          test-type: unit
          mise-task: test:unit
          skip-marker: skip:test:unit
          commit-message: ${{ github.event.head_commit.message }}

      - name: Test / Integration
        uses: ./.github/actions/run-tests
        with:
          test-type: integration
          mise-task: test:integration
          skip-marker: skip:test:integration
          commit-message: ${{ github.event.head_commit.message }}

      - name: Test / E2E
        uses: ./.github/actions/run-tests
        with:
          test-type: e2e
          mise-task: test:e2e
          skip-marker: skip:test:e2e
          commit-message: ${{ github.event.head_commit.message }}

      - name: Test / Unit (lowest-direct)
        uses: ./.github/actions/run-tests
        with:
          test-type: unit
          mise-task: test:lowest_direct
          skip-marker: skip:test:lowest-direct
          commit-message: ${{ github.event.head_commit.message }}

      - name: Publish test results
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: ${{ !cancelled() && (env.GITHUB_WORKFLOW_RUNTIME != 'ACT') }}
        with:
          name: Test Results
          path: reports/junit*.xml
          reporter: java-junit

      - name: SonarQube Scan
        if: ${{ !cancelled() && (env.GITHUB_WORKFLOW_RUNTIME != 'ACT') }}
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
