name: "> Test"

on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: true

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      checks: write
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Dev Environment
        uses: $/.github/actions/setup-dev-env

      - name: Release version check
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          TOML_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$TAG_VERSION" != "$TOML_VERSION" ]; then
            echo "Release version mismatch: Tag $TAG_VERSION != pyproject.toml $TOML_VERSION"
            exit 1
          fi

      - name: Print development version info
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          TOML_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "Development build - Current version in pyproject.toml: $TOML_VERSION"

      - name: Test / Unit
        uses: $/.github/actions/run-tests
        with:
          test-type: unit
          mise-task: test:unit
          skip-marker: skip:test:unit
          commit-message: ${{ github.event.head_commit.message }}

      - name: Test / Integration
        uses: $/.github/actions/run-tests
        with:
          test-type: integration
          mise-task: test:integration
          skip-marker: skip:test:integration
          commit-message: ${{ github.event.head_commit.message }}

      - name: Test / E2E
        uses: $/.github/actions/run-tests
        with:
          test-type: e2e
          mise-task: test:e2e
          skip-marker: skip:test:e2e
          commit-message: ${{ github.event.head_commit.message }}

      - name: Test / Coverage floor
        # Skipped with any skip:test:* marker or label: partial coverage would fail for the wrong reason.
        if: ${{ !contains(format('{0} {1}', github.event.head_commit.message, join(github.event.pull_request.labels.*.name, ' ')), 'skip:test:') }}
        run: mise run test:coverage

      - name: Test / Unit (lowest-direct)
        uses: $/.github/actions/run-tests
        with:
          test-type: unit
          mise-task: test:lowest_direct
          skip-marker: skip:test:lowest-direct
          commit-message: ${{ github.event.head_commit.message }}

      - name: Test / Unit (all supported Python versions)
        uses: $/.github/actions/run-tests
        with:
          test-type: unit
          mise-task: test:python_versions
          skip-marker: skip:test:python-versions
          commit-message: ${{ github.event.head_commit.message }}

      - name: Publish test results
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        if: ${{ !cancelled() && (env.GITHUB_WORKFLOW_RUNTIME != 'ACT') }}
        with:
          name: Test Results
          path: reports/junit*.xml
          reporter: java-junit

      - name: SonarQube Scan
        if: ${{ !cancelled() && (env.GITHUB_WORKFLOW_RUNTIME != 'ACT') }}
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # On pull requests, wait for the SonarCloud quality gate and fail this job if it is red, so
          # its conditions (e.g. coverage on new code) block the merge. Conditions live in SonarCloud.
          args: ${{ github.event_name == 'pull_request' && '-Dsonar.qualitygate.wait=true' || '' }}
