name: lint-workflows

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'

jobs:
  lint-workflows:
    name: Lint workflow files
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check action pins
        id: pinact
        continue-on-error: true
        uses: suzuki-shunsuke/pinact-action@b1a1f46bb10f2908950d95f626ca8cc109e2cf7d # v3.1.0
        with:
          review: "true"
          skip_push: "true"
          github_token_for_review: ${{ github.token }}
          reviewdog_filter_mode: added

      - name: Lint with actionlint
        id: actionlint
        continue-on-error: true
        uses: reviewdog/action-actionlint@a7d35aaf8c309203a4ae861d32b7bd490baa7bf3 # v1.83.0
        with:
          github_token: ${{ github.token }}
          reporter: github-pr-review
          filter_mode: added
          fail_on_error: "true"

      - name: Fail if any linter reported errors
        if: steps.pinact.outcome == 'failure' || steps.actionlint.outcome == 'failure'
        run: exit 1
