name: "+ CI/CD"

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  # Pushes/merges to main trigger test deployment; release/v* branches trigger stage + prod
  # NOTE: `aignostics-release-bot` must be in the `main` branch protection bypass list
  # (set to "Always allow") so it can push version-bump commits during automated releases.
  push:
    branches: ["main"]
    tags:
      - "v*"

  # Manual trigger for any branch
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:

  lint:
    if: (!contains(github.event.head_commit.message, '[skip ci]'))
    uses: ./.github/workflows/_lint.yml
    permissions:
      contents: read
      packages: read

  audit:
    # Skip on pull_request:closed as merge commits also triggeres this and they share the same concurrency group
    if: |
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !(github.event_name == 'pull_request' && github.event.action == 'closed')
    uses: ./.github/workflows/_audit.yml
    permissions:
      contents: read
      packages: read

  test:
    # Skip on pull_request:closed as merge commits also triggeres this and they share the same concurrency group
    if: |
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !(github.event_name == 'pull_request' && github.event.action == 'closed')
    uses: ./.github/workflows/_test.yml
    permissions:
      attestations: write
      checks: write
      contents: read
      packages: write
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      AIGNOSTICS_TME_STUDIO_LOGFIRE_TOKEN: ${{ secrets.AIGNOSTICS_TME_STUDIO_LOGFIRE_TOKEN }}
      AIGNOSTICS_TME_STUDIO_SENTRY_DSN: ${{ secrets.AIGNOSTICS_TME_STUDIO_SENTRY_DSN }}

  publish_package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, audit, test]
    uses: ./.github/workflows/_package-publish.yml
    permissions:
      contents: write
      id-token: write
      packages: read
