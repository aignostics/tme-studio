name: "+ Release Bump"

on:
  workflow_dispatch:
    inputs:
      arguments:
        description: "Optional arguments passed to `cz bump` (e.g. '--increment major --prerelease rc'). Leave empty for auto-detection from commit messages."
        required: false
        type: string
        default: ""
  workflow_call:

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Setup Dev Environment
        uses: ./.github/actions/setup-dev-env

      - name: Configure git identity
        run: |
          git config user.name "aignostics-release-bot[bot]"
          git config user.email "aignostics-release-bot[bot]@users.noreply.github.com"

      - name: Verify mise.lock is in sync
        # The lockfile verify workflow only runs on pull_request, and only when a
        # mise file changed -- so version skew, which staleness comes from, never
        # gates a release. Check it here, before the bump commit and tag exist:
        # discovering it at push time means unwinding a tag instead of a re-run.
        env:
          # mise-action v5 no longer exports its token; unauthenticated, `mise lock` hits GitHub's 60 req/h limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mise lock
          if ! git diff --exit-code -- mise.lock; then
            echo "::error file=mise.lock::mise.lock is out of date; regenerate and commit it before releasing"
            exit 1
          fi

      - name: Bump version
        env:
          BUMP_ARGS: ${{ inputs.arguments }}
        # Force a full changelog rebuild instead of `cz bump`'s incremental mode: incremental mode
        # matches CHANGELOG.md's latest entry to a git tag and hard-fails ("No tag found to do an
        # incremental changelog") if that tag is missing, e.g. after a tag was deleted or never
        # pushed. Truncating first makes every bump self-healing and independent of changelog/tag drift.
        run: |
          : > CHANGELOG.md
          # Preflight: --dry-run computes the new version and changelog without
          # committing, tagging or pushing. If cz would fail (no bumpable commits,
          # bad --increment, version conflict), fail here -- before any tag exists --
          # instead of leaving a half-bumped commit with no tag behind.
          # cz is a dev dependency, not on PATH: invoke it through uv.
          # shellcheck disable=SC2086  # BUMP_ARGS holds multiple flags (e.g. "--increment major --prerelease rc"); word-splitting is intentional
          uv run cz bump --dry-run --yes $BUMP_ARGS
          # shellcheck disable=SC2086  # see above
          uv run cz bump --no-verify --yes $BUMP_ARGS

      - name: Update lockfile and amend bump commit
        run: |
          uv lock
          git add uv.lock
          git commit --amend --no-edit --no-verify
          git tag -f "v$(cat VERSION)"

      - name: Push version bump and tag
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        # --no-verify: the mise-lock pre-push hook regenerates mise.lock and aborts
        # the push. A release job must push exactly what it built and tagged, not
        # rewrite tracked files after the commit and tag already exist.
        run: git push --no-verify origin main --tags
