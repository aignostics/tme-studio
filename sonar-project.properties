sonar.projectKey=aignostics_tme-studio2
sonar.organization=aignostics
sonar.projectVersion=0.0.0
sonar.projectDescription=🎨 A toolkit to explore the Aignostics OpenTME dataset.
sonar.links.homepage=https://github.com/aignostics/tme-studio
sonar.links.scm=https://github.com/aignostics/tme-studio
sonar.links.ci=https://github.com/aignostics/tme-studio/actions
sonar.links.issues=https://github.com/aignostics/tme-studio/issues
sonar.python.coverage.reportPaths=reports/coverage.xml
sonar.python.version=3.11, 3.12, 3.13
sonar.coverage.exclusions=.mise/**, tests/**, docs/**, dist/**
# notebooks/**: marimo cells end in a bare expression to render their output, which
# Sonar reports as S905 "statement has no side effects" on every changed cell.
sonar.exclusions=.mise/**, docs/**, dist/**, **/notebooks/**

# Rule exclusions — pip-flavored rules that misfire on the uv-driven workflows
# and Dockerfile this template ships. uv provides build isolation by default
# (so S8541 "Omitting --no-build" doesn't apply) and `uv sync --frozen` installs
# strictly from the lockfile / `uv run` doesn't install at all (so S8544
# "Using dependencies without locking" doesn't apply either). Captured here as
# a project-policy decision rather than per-line `# NOSONAR` suppressions in
# source.
sonar.issue.ignore.multicriteria=uvBuildIsolationDocker,uvBuildIsolationGha,uvFrozenLockGha
sonar.issue.ignore.multicriteria.uvBuildIsolationDocker.ruleKey=docker:S8541
sonar.issue.ignore.multicriteria.uvBuildIsolationDocker.resourceKey=**/Dockerfile
sonar.issue.ignore.multicriteria.uvBuildIsolationGha.ruleKey=githubactions:S8541
sonar.issue.ignore.multicriteria.uvBuildIsolationGha.resourceKey=**/.github/workflows/*.yml
sonar.issue.ignore.multicriteria.uvFrozenLockGha.ruleKey=githubactions:S8544
sonar.issue.ignore.multicriteria.uvFrozenLockGha.resourceKey=**/.github/workflows/*.yml
