# .pre-commit-config.yaml
default_install_hook_types:
  - pre-commit
  - pre-push
  - commit-msg
fail_fast: true
repos:
  - repo: meta
    hooks:
      - id: check-useless-excludes
  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: 3a6eb0fadf60b3cccfd80bad9dbb6fae7e47b316  # frozen: v1.10.0
    hooks:
      - id: python-check-mock-methods
      - id: python-no-eval
      - id: python-no-log-warn
      - id: python-use-type-annotations
      - id: rst-backticks
      - id: rst-directive-colons
      - id: rst-inline-touching-normal
      - id: text-unicode-replacement-char
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
        exclude: |
          (?x)^(
            mise\.lock|
            uv\.lock
          )$
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: check-merge-conflict
        args: ["--assume-in-merge"]
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-xml
      - id: debug-statements
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: "^tests/fixtures/|.json$|"
      - id: fix-byte-order-marker
      - id: mixed-line-ending
      - id: name-tests-test
        exclude: "constants.py|conftest.py|__init__.py"
      - id: requirements-txt-fixer
      - id: trailing-whitespace
  - repo: https://github.com/Yelp/detect-secrets
    rev: 01886c8a910c64595c47f186ca1ffc0b77fa5458  # frozen: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        additional_dependencies: ["gibberish-detector"]
  - repo: https://github.com/commitizen-tools/commitizen
    rev: f690817de25831a37094ca35af5ada05c909ff1c  # frozen: v4.19.3
    hooks:
      - id: commitizen
        stages: [commit-msg]
  - repo: local
    hooks:
      - id: mise-lock
        # always_run, not `files: ^mise\.toml$`: mise itself appends platform checksums to
        # mise.lock as it installs tools, so the lock drifts without mise.toml ever changing.
        # Fixing it here means a push never fails on it.
        name: Update mise.lock
        entry: bash -c 'mise lock && git add mise.lock'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: uv-lock
        name: Update uv.lock
        entry: bash -c 'uv lock && git add uv.lock'
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$
        stages: [pre-commit]
      - id: lint
        name: Lint
        entry: bash -c 'mise run lint'
        language: system
        pass_filenames: false
        always_run: true
        verbose: true
        stages: [pre-commit]

      - id: test-unit
        name: Test (unit)
        entry: bash -c 'mise run test:unit --no-cov -x'
        language: system
        pass_filenames: false
        files: \.(py|toml)$|^conftest\.py$
        verbose: true
        stages: [pre-push]
