[tools]
act = "0.2.97"
"github:minamijoyo/hcledit" = "0.2.18"
gh = "2.103.3"
jq = "1.8.2"
# certifi>=2026.10.19 removes the compromised eMudhra root (GHSA-hq85-5cpj-mr62). This
# tool does not use uv.lock, so the floor is set here. Remove it once every install has
# a fixed certifi.
"pipx:keyring" = { version = "25.7.0", uvx_args = "--with keyrings.google-artifactregistry-auth --with certifi>=2026.10.19" }
trivy = "0.76.2"
uv = "0.13.7"

[env]
# uv's private-registry login: gcloud's token when there is one, else uv's keyring
# provider (pyproject.toml). Run `gcloud auth login --update-adc` if installs 401.
UV_INDEX_AIGNX_PRIVATE_REGISTRY_USERNAME = "oauth2accesstoken"
# tools = true: mise evaluates [env] before putting its tools on PATH, so without it a
# gcloud that mise itself manages would not be found.
_.source = { path = ".mise/scripts/registry_token.sh", tools = true }

[settings]
lockfile = true # Pins exact versions and checksums of tools
python.uv_venv_auto = "create|source"

# tools can read the versions files used by other version managers
idiomatic_version_file_enable_tools = [
  "python", # .python-version stores python version being used
]

[task_config]
includes = [
  "tasks.toml",
  ".mise/tasks",
]
