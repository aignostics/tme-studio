[tools]
act = "0.2.89"
gh = "2.103.2"
jq = "1.8.2"
# certifi>=2026.10.19 removes the compromised eMudhra root (GHSA-hq85-5cpj-mr62). This
# tool does not use uv.lock, so the floor is set here. Remove it once every install has
# a fixed certifi.
"pipx:keyring" = { version = "25.7.0", uvx_args = "--with keyrings.google-artifactregistry-auth --with certifi>=2026.10.19" }
trivy = "0.76.1"
uv = "0.13.5"

[settings]
lockfile = true # Pins exact versions and checksums of tools
python.uv_venv_auto = "create|source"

# tools can read the versions files used by other version managers
idiomatic_version_file_enable_tools = [
  "python", # .python-version stores python version being used
]

[task_config]
includes = [
  "tasks.toml",
  ".mise/tasks",
]
